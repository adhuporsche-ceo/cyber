[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netprobe"
version = "1.0.0"
description = "Authorized network and website security assessment tool"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = []

[project.scripts]
netprobe = "netprobe_cli:main"

[tool.setuptools]
py-modules = ["main", "netprobe_cli"]
